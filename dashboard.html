/* ============================================================
   DARK THEME · CYBERPUNK / GEEK STYLE
   ============================================================ */
:root {
  --bg-primary: #0a0e17;
  --bg-secondary: #111827;
  --bg-card: #161b25;
  --bg-sidebar: #0d1117;
  --bg-hover: #1e293b;
  --border: #1e293b;
  --text-primary: #e2e8f0;
  --text-secondary: #94a3b8;
  --text-muted: #64748b;
  --accent: #00d4ff;
  --accent2: #7c3aed;
  --red: #ef4444;
  --green: #22c55e;
  --orange: #f59e0b;
  --gold: #fbbf24;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", monospace;
  background: var(--bg-primary);
  color: var(--text-primary);
  display: flex;
  height: 100vh;
  overflow: hidden;
}

/* --- SIDEBAR --- */
.sidebar {
  width: 190px;
  min-width: 190px;
  background: var(--bg-sidebar);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 0;
  z-index: 10;
  overflow-y: auto;
}
.sidebar-logo {
  padding: 12px 12px;
  border-bottom: 1px solid var(--border);
  text-align: center;
}
.sidebar-logo .icon { font-size: 22px; }
.sidebar-logo .title {
  font-size: 13px;
  font-weight: 700;
  background: linear-gradient(135deg, #00d4ff, #7c3aed);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin-top: 2px;
}
.sidebar-logo .ver { font-size: 9px; color: var(--text-muted); margin-top: 1px; }
.sidebar-nav { flex: 1; padding: 4px 0; }
.nav-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 14px;
  cursor: pointer;
  color: var(--text-secondary);
  font-size: 12px;
  font-weight: 500;
  border-left: 3px solid transparent;
  transition: all 0.2s;
  margin: 1px 0;
}
.nav-item:hover { background: var(--bg-hover); color: var(--text-primary); }
.nav-item.active {
  background: rgba(0,212,255,0.08);
  color: var(--accent);
  border-left-color: var(--accent);
}
.nav-item .icon { font-size: 14px; width: 18px; text-align: center; }
.nav-divider {
  height: 1px;
  background: var(--border);
  margin: 4px 12px;
}
.sidebar-footer {
  padding: 8px 14px;
  border-top: 1px solid var(--border);
  font-size: 10px;
  color: var(--text-muted);
}
.sidebar-footer .dot { display: inline-block; width: 6px; height: 6px; background: var(--green); border-radius: 50%; margin-right: 6px; animation: pulse 2s infinite; }
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

/* --- MAIN CONTENT --- */
.main-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}
.top-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 8px 16px;
  background: var(--bg-secondary);
  border-bottom: 1px solid var(--border);
  gap: 12px;
}
.top-bar h2 { font-size: 15px; font-weight: 600; color: var(--text-primary); white-space: nowrap; }
.search-box {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 4px 10px;
  width: 220px;
}
.search-box input {
  flex: 1;
  background: transparent;
  border: none;
  outline: none;
  color: var(--text-primary);
  font-size: 11px;
}
.search-box input::placeholder { color: var(--text-muted); }
.search-box .search-icon { color: var(--text-muted); font-size: 14px; }
.top-stats {
  display: flex;
  gap: 14px;
  font-size: 10px;
  color: var(--text-secondary);
  white-space: nowrap;
}
.top-stats span { color: var(--accent); font-weight: 600; }

/* --- SCROLLABLE CONTENT --- */
.content-area {
  flex: 1;
  overflow-y: auto;
  padding: 10px 16px;
  display: none;
}
.content-area.active { display: block; }

/* --- KPI CARDS --- */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 8px;
  margin-bottom: 10px;
}
.kpi-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 14px;
  position: relative;
  overflow: hidden;
}
.kpi-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 2px;
}
.kpi-card:hover { border-color: rgba(0,212,255,0.3); }
.kpi-label { font-size: 10px; color: var(--text-muted); margin-bottom: 4px; }
.kpi-value {
  font-size: 22px;
  font-weight: 700;
  font-family: "JetBrains Mono", "Fira Code", monospace;
}
.kpi-sub { font-size: 10px; color: var(--text-muted); margin-top: 2px; }

/* --- CHART GRID --- */
.chart-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.chart-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 8px; }
.chart-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
}
.chart-card h3 {
  font-size: 12px;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 8px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 4px;
}
.chart-box { width: 100%; height: 240px; }
.chart-box-lg { width: 100%; height: 280px; }
.chart-full { grid-column: 1 / -1; }
.chart-card-full {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
  grid-column: 1 / -1;
}
.chart-card-full h3 {
  font-size: 12px; font-weight: 600; color: var(--text-primary);
  margin-bottom: 8px; padding-bottom: 6px; border-bottom: 1px solid var(--border);
}

/* --- TABLE --- */
.data-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 11px;
}
.data-table thead { position: sticky; top: 0; z-index: 1; }
.data-table th {
  background: var(--bg-secondary);
  padding: 6px 6px;
  text-align: left;
  font-weight: 600;
  color: var(--text-secondary);
  border-bottom: 2px solid var(--border);
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
}
.data-table th:hover { color: var(--accent); }
.data-table td {
  padding: 5px 6px;
  border-bottom: 1px solid rgba(30,41,59,0.5);
  white-space: nowrap;
}
.data-table tr { cursor: pointer; transition: background 0.15s; }
.data-table tr:hover { background: var(--bg-hover); }
.data-table tr.selected { background: rgba(0,212,255,0.1); }
.table-container { max-height: 400px; overflow: auto; }

/* --- TAGS --- */
.tag {
  display: inline-block;
  padding: 1px 6px;
  border-radius: 3px;
  font-size: 9px;
  font-weight: 500;
}
.tag-huijin { background: rgba(239,68,68,0.15); color: #ef4444; }
.tag-zhengjin { background: rgba(0,212,255,0.15); color: #00d4ff; }
.tag-shebao { background: rgba(34,197,94,0.15); color: #22c55e; }
.tag-yanglao { background: rgba(245,158,11,0.15); color: #f59e0b; }
.tag-daijijin { background: rgba(20,184,166,0.15); color: #14b8a6; }
/* stock style tags */
.tag-jiazhi { background: rgba(34,197,94,0.12); color: #22c55e; }       /* PE<15 价值 */
.tag-lanchu { background: rgba(59,130,246,0.12); color: #3b82f6; }        /* PE 15-25 蓝筹 */
.tag-chengzhang { background: rgba(245,158,11,0.12); color: #f59e0b; }    /* PE 25-50 成长 */
.tag-gaochengzhang { background: rgba(239,68,68,0.12); color: #ef4444; }  /* PE>50 高成长 */

.positive { color: var(--red); }
.negative { color: var(--green); }

/* --- MODAL --- */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0,0,0,0.7);
  z-index: 100;
  justify-content: center;
  align-items: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 24px;
  max-width: 700px;
  width: 90%;
  max-height: 80vh;
  overflow-y: auto;
}
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  padding-bottom: 12px;
  border-bottom: 1px solid var(--border);
}
.modal-header h3 { font-size: 18px; color: var(--accent); }
.modal-close {
  background: none; border: none;
  color: var(--text-muted);
  font-size: 24px;
  cursor: pointer;
}
.modal-close:hover { color: var(--text-primary); }
.modal-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}
.modal-item {
  padding: 8px 12px;
  background: var(--bg-secondary);
  border-radius: 6px;
}
.modal-item .label { font-size: 11px; color: var(--text-muted); }
.modal-item .value { font-size: 15px; font-weight: 600; color: var(--text-primary); margin-top: 2px; }
.modal-section {
  margin-top: 16px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.modal-section h4 { font-size: 13px; color: var(--accent); margin-bottom: 8px; }

/* --- NEWS --- */
.news-item {
  padding: 8px 10px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.15s;
}
.news-item:hover { background: var(--bg-hover); }
.news-title { font-size: 12px; font-weight: 500; color: var(--text-primary); margin-bottom: 2px; }
.news-meta { font-size: 10px; color: var(--text-muted); }
.news-summary { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

/* --- RESPONSIVE --- */
@media (max-width: 1024px) {
  .chart-row, .chart-row-3 { grid-template-columns: 1fr; }
  .sidebar { width: 50px; min-width: 50px; }
  .sidebar .nav-item span:not(.icon), .sidebar-logo .title, .sidebar-logo .ver { display: none; }
  .top-stats { display: none; }
}

/* Scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: var(--bg-primary); }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

/* status indicator bar */
.status-52w { display: flex; align-items: center; gap: 4px; }
.status-52w-bar {
  flex: 1; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden;
}
.status-52w-fill { height: 100%; border-radius: 2px; }
</style>

// GLOBAL STATE
// ============================================================
var D = null; // APP_DATA
var charts = {};
var activePage = 'overview';
var filteredData = null;
var selectedStock = null;

// ============================================================
// DATA LOADING
// ============================================================
function loadData() {
  // 优先尝试实时拉取 data.json（http server 环境下），失败则回退到内嵌快照
  try {
    fetch('data.json', {cache: 'no-store'})
      .then(function(r){ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(d){
        if (d && d.meta && d.meta.update_time) {
          var oldTime = D ? (D.meta.update_time||'') : '';
          var newTime = d.meta.update_time;
          // 只有新数据比当前新才更新
          if (newTime !== oldTime) {
            D = d;
            refreshAll();
          }
        }
      })
      .catch(function(){ /* 双击打开(file://)或404时用内嵌数据 */ });
  } catch(e) { /* 忽略 */ }

  var el = document.getElementById('embedded-data');
  if (el && el.textContent.trim()) {
    try { D = JSON.parse(el.textContent.trim()); return true; }
    catch(e) { console.error('Data parse error:', e); }
  }
  return false;
}

// 手动刷新：重新拉取 data.json 并重渲染
function manualRefresh() {
  var btn = document.getElementById('btn-refresh');
  if (btn) { btn.textContent = '⏳ 刷新中...'; btn.disabled = true; }
  // file:// 协议下浏览器禁止 fetch,直接走内嵌数据并提示
  if (location.protocol === 'file:') {
    setTimeout(function(){
      if (btn) { btn.textContent = '🔄 刷新数据'; btn.disabled = true; btn.title = 'file:// 协议下浏览器禁止 fetch,数据为内嵌快照'; }
      showInlineTip(btn, '💡 file:// 协议无法自动更新,请用 python3 -m http.server 8080 启动本地服务器');
    }, 200);
    return;
  }
  fetch('data.json', {cache: 'no-store'})
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(d){
      if (d && d.meta && d.meta.update_time) {
        D = d;
        refreshAll();
        var btn = document.getElementById('btn-refresh');
        if (btn) { btn.textContent = '🔄 刷新数据'; btn.disabled = false; }
        var oldTimeEl = document.getElementById('data-time-note');
        if (oldTimeEl) oldTimeEl.style.display = 'none';
      } else {
        throw new Error('数据格式无效');
      }
    })
    .catch(function(e){
      var btn = document.getElementById('btn-refresh');
      if (btn) { btn.textContent = '🔄 刷新数据'; btn.disabled = false; }
      showInlineTip(btn, '❌ 刷新失败: ' + e.message + ' — 重跑 python3 collect_data.py 后再点');
    });
}

function showInlineTip(anchor, msg) {
  // 移除已有提示
  var old = document.getElementById('refresh-inline-tip');
  if (old) old.remove();
  // 8s 后自动消失
  var tip = document.createElement('div');
  tip.id = 'refresh-inline-tip';
  tip.textContent = msg;
  tip.style.cssText = 'position:absolute;top:48px;right:24px;z-index:9999;background:rgba(22,27,37,0.96);border:1px solid var(--accent);color:var(--text);padding:10px 14px;border-radius:8px;font-size:12px;box-shadow:0 4px 20px rgba(0,212,255,0.2);max-width:340px;line-height:1.5';
  document.body.appendChild(tip);
  setTimeout(function(){ if (tip && tip.parentNode) tip.remove(); }, 8000);
}

// 协议自检:file:// 下禁用刷新按钮
(function(){
  if (location.protocol === 'file:' && document.readyState !== 'loading') {
    setTimeout(function(){
      var btn = document.getElementById('btn-refresh');
      if (btn) { btn.title = 'file:// 协议无法 fetch,请用 python3 -m http.server 8080'; }
    }, 100);
  }
})();

// 数据更新后统一重渲染
function refreshAll() {
  var m = D.meta;
  document.getElementById('top-stocks').textContent = m.total_stocks + '只';
  var tv = m.total_value_yi;
  document.getElementById('top-value').textContent = tv > 10000 ? (tv/10000).toFixed(2)+'万亿' : tv.toFixed(0)+'亿';
  document.getElementById('top-time').textContent = m.update_time;
  var ss = document.getElementById('sidebar-status');
  if (ss) ss.textContent = '更新: ' + m.update_time.split(' ')[1];
  // 重渲染当前页
  renderPage(activePage);
}

function switchPage(pageId) {
  activePage = pageId;

  // Update nav
  document.querySelectorAll('.nav-item').forEach(function(n) { n.classList.remove('active'); });
  var navItem = document.querySelector('[data-page="'+pageId+'"]');
  if (navItem) navItem.classList.add('active');

  // Update pages
  document.querySelectorAll('.content-area').forEach(function(p) { p.classList.remove('active'); });
  var page = document.getElementById('page-'+pageId);
  if (page) page.classList.add('active');

  // Update title
  var titles = {
    overview:'📊 总览看板', scatter:'🔵 PE-PB 估值散点图', holdings:'📋 持仓明细',
    financials:'💰 财务指标', market:'📈 实时行情监控', news:'📰 新闻资讯', entities:'🏛️ 国家队团队',
    etf:'💰 ETF追踪', fundflow:'💸 主力资金监控', funds:'💧 资金流量', compare:'🆚 持仓对比'
  };
  document.getElementById('page-title').textContent = titles[pageId] || pageId;

  // Dispose old charts in this page
  Object.keys(charts).forEach(function(k) {
    if (k.startsWith(pageId+'_')) { try { charts[k].dispose(); } catch(e){} delete charts[k]; }
  });

  // Render
  renderPage(pageId);
}

}

function renderScatterChart(id) {
  var c = echarts.init(document.getElementById(id));
  var data = D.stock_summary;
  var teamColors = {'汇金系':'#ef4444','证金系':'#00d4ff','社保系':'#22c55e','养老金系':'#f59e0b','大基金系':'#14b8a6'};

  var seriesData = {};
  data.forEach(function(s) {
    if (s.pe_ttm <= 0 || s.pb <= 0) return;
    var hTypes = [];
    s.holders.forEach(function(h) { if (hTypes.indexOf(h.team_type)<0) hTypes.push(h.team_type); });
    var color = teamColors[hTypes[0]] || '#94a3b8';
    if (!seriesData[color]) seriesData[color] = [];
    seriesData[color].push({
      value: [s.pe_ttm, s.pb, s.total_holding_value],
      name: s.name,
      code: s.code,
      industry: s.industry,
      sector: s.sector,
      price: s.price,
      change_pct: s.change_pct,
      mcap: s.mcap_yi,
      holdingVal: s.total_holding_value,
      teamTypes: hTypes,
      itemStyle: { color: color }
    });
  });

  var topLabels = new Set();
  D.stock_summary.slice(0, 15).forEach(function(s) { topLabels.add(s.name); });

  var series = [];
  var colorNames = {'#ef4444':'汇金系','#00d4ff':'证金系','#22c55e':'社保系','#f59e0b':'养老金系','#14b8a6':'大基金系','#94a3b8':'其他'};
  Object.keys(seriesData).forEach(function(color) {
    series.push({
      name: colorNames[color] || color,
      type: 'scatter',
      data: seriesData[color],
      symbolSize: function(val) {
        var size = Math.sqrt(val[2]) / 15;
        return Math.max(8, Math.min(60, size));
      },
      emphasis: { focus: 'series', scale: 1.5 },
      label: {
        show: true,
        formatter: function(p) { return topLabels.has(p.name) ? p.name : ''; },
        position: 'top', fontSize: 9,
        color: '#94a3b8', distance: 6
      }
    });
  });

  c.setOption({
    tooltip: {
      trigger: 'item',
      backgroundColor: 'rgba(22,27,37,0.95)',
      borderColor: '#1e293b',
      textStyle: { color: '#e2e8f0', fontSize: 12 },
      formatter: function(p) {
        var d = p.data;
        return '<strong>'+d.name+'</strong> ('+d.code+')<br/>'+
          'PE(TTM): '+p.value[0].toFixed(1)+' | PB: '+p.value[1].toFixed(2)+'<br/>'+
          '持仓市值: '+d.holdingVal.toFixed(1)+'亿 | 总市值: '+d.mcap.toFixed(0)+'亿<br/>'+
          '现价: '+d.price.toFixed(2)+' | 涨跌: '+(d.change_pct>0?'+':'')+d.change_pct.toFixed(2)+'%<br/>'+
          '行业: '+d.industry+' | '+d.teamTypes.join('、');
      }
    },
    legend: {
      top: 5, right: 10,
      orient: 'horizontal',
      itemGap: 14,
      itemWidth: 14,
      itemHeight: 10,
      textStyle: { color: '#94a3b8', fontSize: 10 }
    },
    grid: { left: '5%', right: '8%', bottom: '12%', top: '16%', containLabel: true },
    xAxis: {
      type: 'value', name: 'PE(TTM)', nameLocation: 'middle', nameGap: 30,
      nameTextStyle: { color: '#94a3b8' },
      axisLine: { lineStyle: { color: '#1e293b' } },
      axisLabel: { color: '#64748b' },
      splitLine: { lineStyle: { color: '#1e293b', type: 'dashed' } }
    },
    yAxis: {
      type: 'value', name: 'PB(倍)', nameTextStyle: { color: '#94a3b8' },
      axisLine: { lineStyle: { color: '#1e293b' } },
      axisLabel: { color: '#64748b' },
      splitLine: { lineStyle: { color: '#1e293b', type: 'dashed' } }
    },
    series: series
  });

  c.on('click', function(params) {
    if (params.componentType === 'series') {
      showScatterFilter([params.data]);
    }
  });

  // Click blank area to reset
  c.getZr().on('click', function(params) {
    if (!params.target) {
      resetScatterFilter();
    }
  });

  return c;
}

function getTeamTagClass(teamType) {
  var map = {'汇金系':'huijin','证金系':'zhengjin','社保系':'shebao','养老金系':'yanglao','大基金系':'daijijin'};
  return map[teamType] || '';
}
function getStyleTag(pe) {
  if (pe <= 0) return {cls:'', label:''};
  if (pe < 15) return {cls:'tag-jiazhi', label:'价值'};
  if (pe < 25) return {cls:'tag-lanchu', label:'蓝筹'};
  if (pe < 50) return {cls:'tag-chengzhang', label:'成长'};
  return {cls:'tag-gaochengzhang', label:'高成长'};
}

var sortState = { field: 'holding_value_yi', asc: false };
function sortTable(field) {
  if (sortState.field === field) sortState.asc = !sortState.asc;
  else { sortState.field = field; sortState.asc = false; }
  var data = filteredData ? filteredData.slice() : D.holdings_detail.slice();
  data.sort(function(a,b) {
    var va = a[field] || 0, vb = b[field] || 0;
    if (typeof va === 'string') return sortState.asc ? va.localeCompare(vb) : vb.localeCompare(va);
    return sortState.asc ? va - vb : vb - va;
  });

function renderChangeDist(id) {
  var c = echarts.init(document.getElementById(id));
  var data = D.stock_summary;
  var bins = { '跌>3%':0,'跌1-3%':0,'跌0-1%':0,'平盘':0,'涨0-1%':0,'涨1-3%':0,'涨>3%':0 };
  data.forEach(function(s) {
    var cp = s.change_pct;
    if (cp < -3) bins['跌>3%']++;
    else if (cp < -1) bins['跌1-3%']++;
    else if (cp < 0) bins['跌0-1%']++;
    else if (cp === 0) bins['平盘']++;
    else if (cp <= 1) bins['涨0-1%']++;
    else if (cp <= 3) bins['涨1-3%']++;
    else bins['涨>3%']++;
  });
  c.setOption({
    tooltip: {trigger:'axis'},
    grid: {left:'3%',right:'4%',bottom:'3%',top:'3%',containLabel:true},
    xAxis: {type:'category',data:Object.keys(bins),axisLabel:{color:'#94a3b8',fontSize:10,rotate:30}},
    yAxis: {type:'value',name:'标的数',axisLabel:{color:'#64748b'},splitLine:{lineStyle:{color:'#1e293b',type:'dashed'}}},
    series: [{type:'bar',data:Object.values(bins),itemStyle:{color:function(p){
      var colors = ['#22c55e','#4ade80','#86efac','#94a3b8','#fca5a5','#f87171','#ef4444'];
      return colors[p.dataIndex]||'#94a3b8';
    }},barWidth:'60%'}]
  });
  return c;
}

// 板块多线趋势图（近N交易日累计主力净流入，最右端=当日值）
function renderSectorFlowChart(id, sf) {
  var c = echarts.init(document.getElementById(id));
  var palette = ['#ef4444','#22c55e','#00d4ff','#f59e0b','#8b5cf6','#ec4899','#14b8a6','#f97316','#3b82f6','#84cc16','#eab308','#a855f7'];
  var series = [];
  sf.sectors.forEach(function(s, i) {
    // 累计净流入曲线
    var cum = [], acc = 0;
    s.days.forEach(function(v) { acc += v; cum.push(Math.round(acc*1000)/1000); });
    var lastVal = cum[cum.length-1] || 0;
    series.push({
      name: s.name,
      type: 'line',
      smooth: true,
      symbol: 'circle',
      symbolSize: 4,
      showSymbol: false,
      lineStyle: {width: 2},
      itemStyle: {color: palette[i%palette.length]},
      emphasis: {focus: 'series'},
      data: cum,
      endLabel: {
        show: true,
        color: lastVal>0 ? '#ef4444' : '#22c55e',
        fontSize: 10,
        fontWeight: 600,
        formatter: function(p) {
          var v = p.value;
          return s.name + ' ' + (v>0?'+':'') + v.toFixed(1) + '亿';
        }
      }
    });
  });
  c.setOption({
    backgroundColor: 'transparent',
    tooltip: {
      trigger: 'axis',
      formatter: function(ps) {
        var idx = ps[0].dataIndex;
        var date = sf.dates[idx];
        var html = '<b>'+date+'</b>（累计值）<br/>';
        ps.forEach(function(p) {
          html += '<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:'+p.color+';margin-right:4px"></span>'+p.seriesName+': <b>'+(p.value>0?'+':'')+p.value.toFixed(2)+'亿</b><br/>';
        });
        // 当日值
        html += '<div style="border-top:1px dashed #334155;margin-top:4px;padding-top:4px;color:#94a3b8">悬停末点可看当日主力净额(单日口径)</div>';
        return html;
      }
    },
    legend: {show: false},
    grid: {left:'3%', right:'120', bottom:'3%', top:'4%', containLabel:true},
    xAxis: {
      type: 'category',
      data: sf.dates.map(function(d){ return d.slice(5); }),
      axisLabel: {color:'#64748b', fontSize:10},
      axisLine: {lineStyle:{color:'#334155'}},
      splitLine: {show:false}
    },
    yAxis: {
      type: 'value',
      name: '累计净流入(亿)',
      nameTextStyle: {color:'#64748b'},
      axisLabel: {color:'#64748b', fontSize:10},
      splitLine: {lineStyle:{color:'#1e293b', type:'dashed'}},
      splitArea: {show:false}
    },
    series: series
  });
  return c;
}

// 单向 TOP10 横向条形图（流入/流出通用）
function renderFlowBar(id, data, color) {
  var c = echarts.init(document.getElementById(id));
  var sorted = data.slice().sort(function(a,b){ return a.net_yi - b.net_yi; }); // 横向条从下到上递增
  var grad = color === '#ef4444'
    ? new echarts.graphic.LinearGradient(0,0,1,0,[{offset:0,color:'#7f1d1d'},{offset:1,color:'#ef4444'}])
    : new echarts.graphic.LinearGradient(0,0,1,0,[{offset:0,color:'#14532d'},{offset:1,color:'#22c55e'}]);
  c.setOption({
    tooltip: {
      trigger:'axis', axisPointer:{type:'shadow'},
      formatter:function(p){
        var v = p[0].value;
        return p[0].name + '<br/>主力净额: <b>' + (v>0?'+':'') + v.toFixed(2) + ' 亿</b>';
      }
    },
    grid: {left:'3%', right:'14%', bottom:'3%', top:'3%', containLabel:true},
    xAxis: {type:'value', name:'亿元', axisLabel:{color:'#64748b'}, splitLine:{lineStyle:{color:'#1e293b',type:'dashed'}}},
    yAxis: {type:'category', data:sorted.map(function(d){return d.name}), axisLabel:{color:'#94a3b8',fontSize:11}},
    series: [{
      type:'bar',
      data: sorted.map(function(d){
        return {value: Math.abs(d.net_yi), real: d.net_yi, itemStyle:{color:grad, borderRadius:[0,4,4,0]}};
      }),
      barWidth:'62%',
      label:{
        show:true, position:'right', fontSize:10, color:'#94a3b8',
        formatter:function(p){ var r=p.data.real; return (r>0?'+':'')+r.toFixed(2); }
      }
    }]
  });
  return c;
}

// 通达信自选股代码格式：市场位(1=沪 0=深) + 6位代码
function toTdxCode(mkt, code) {
  return (mkt === 'sh' ? '1' : '0') + code;
}

// 导出通达信 .blk 自选股文件
function exportTdxBlk(scope) {
  var ff = D.main_force_flow;
  if (!ff) { alert('暂无资金流数据'); return; }
  var items = [];
  if (scope === 'flow') items = ff.market_top_in.concat(ff.market_top_out);
  else if (scope === 'team') items = ff.team_holdings;
  else {
    var seen = {}, merged = ff.market_top_in.concat(ff.market_top_out, ff.team_holdings);
    merged.forEach(function(it){ if(!seen[it.code]){ seen[it.code]=1; items.push(it); } });
  }
  var content = items.map(function(it){ return toTdxCode(it.mkt, it.code); }).join('\r\n') + '\r\n';
  var names = {flow:'主力资金监控', team:'国家队持仓', all:'资金+国家队'};
  var blob = new Blob(['\ufeff'+content], {type:'text/plain;charset=utf-8'});
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'tdx_' + names[scope] + '_' + ff.trade_date + '.blk';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1000);
}

// 复制代码到剪贴板
function copyTdxCode(fullCode) {
  var code = fullCode.replace(/^(sh|sz)/, '');
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(code).then(function(){
      var el = document.getElementById('page-title');
      if (el) { var old = el.textContent; el.textContent = '✅ 已复制：' + code;
        setTimeout(function(){ el.textContent = old; }, 1500); }
    });
  } else {
    prompt('复制代码：', code);
  }
}

function renderFundsDual(id) {
  var c = echarts.init(document.getElementById(id));
  var f = D.market_funds || {};
  var sh = f.fund_flow_sh || {};
  var dates = Object.keys(sh).sort();
  var klines = (f.index_klines || {}).sh000001;
  var kl_map = {};
  if (klines && klines.kline) {
    klines.kline.forEach(function(k){ kl_map[k[0]] = k[2]; });  // close
  }
  // 与 dates 严格对齐：K线缺失的日期填 null（ECharts 跳过断点）。
  // 不可用 filter 剔除——否则序列长度 < dates，整条指数线会与 X 轴错位。
  var shPoints = dates.map(function(d){
    var kl = kl_map[d];
    return kl != null ? +(+kl).toFixed(2) : null;
  });
  var mainPoints = dates.map(function(d){ return [d, +(((sh[d]||{}).main||0)/1e8).toFixed(2)]; });
  var singleDay = dates.length === 1;
  // 指数Y轴自适应（跳过 null，避免 min/max 被污染）
  var indexVals = shPoints.filter(function(v){return v!=null;}).map(Number);
  if (indexVals.length === 0) { indexVals = [0]; }
  var idxMin = Math.round(Math.min.apply(null, indexVals) * 0.99 * 100) / 100;
  var idxMax = Math.round(Math.max.apply(null, indexVals) * 1.01 * 100) / 100;
  if (idxMax - idxMin < 5) { idxMin = idxMin - 3; idxMax = idxMax + 3; }
  c.setOption({
    tooltip: {trigger:'axis',axisPointer:{type:'cross'},backgroundColor:'rgba(22,27,37,0.95)',borderColor:'#1e293b',textStyle:{color:'#e2e8f0',fontSize:11},

    legend: {data:['上证指数','主力净额(亿元)'],textStyle:{color:'#94a3b8',fontSize:10},top:0},
    grid: {left:'3%',right:'8%',bottom:'8%',top:'10%',containLabel:true},
    xAxis: [
      {type:'category',data:dates,axisPointer:{type:'shadow'},axisLabel:{color:'#64748b',fontSize:9,interval:Math.max(0,Math.floor(dates.length/10))}},
      {type:'category',data:dates,gridIndex:0,axisLabel:{show:false},axisLine:{show:false},axisTick:{show:false}}
    ],
    yAxis: [
      {type:'value',name:'指数',nameTextStyle:{color:'#94a3b8'},position:'left',min:idxMin,max:idxMax,axisLabel:{color:'#94a3b8'},splitLine:{lineStyle:{color:'#1e293b',type:'dashed'}}},
      {type:'value',name:'亿元',nameTextStyle:{color:'#94a3b8'},position:'right',axisLabel:{color:'#94a3b8',formatter:function(v){return v.toFixed(1);}},splitLine:{show:false}}
    ],

function renderETFTrend(id, code) {
  var c = echarts.init(document.getElementById(id));
  var t = (D.etf_history_trend||{})[code];
  if (!t) return c;
  // 计算区间变化
  var shares = t.shares;
  var first = shares[0], last = shares[shares.length-1];
  var change = last - first;
  var changePct = first > 0 ? (change/first*100).toFixed(2) : 0;
  var up = change >= 0;
  var lineColor = up ? '#ef4444' : '#22c55e';
  // 区间涨跌幅图例数据
  c.setOption({
    tooltip: {trigger:'axis',backgroundColor:'rgba(22,27,37,0.95)',borderColor:'#1e293b',textStyle:{color:'#e2e8f0',fontSize:11},
      formatter: function(ps) {
        var p = ps[0];
        var idx = p.dataIndex;
        var prev = idx>0 ? shares[idx-1] : shares[0];
        var chg = prev>0 ? ((shares[idx]-prev)/prev*100).toFixed(2) : '0.00';
        return t.name+'<br/>'+p.axisValue+'<br/>份额: '+shares[idx].toFixed(2)+'亿份<br/>较上日: '+(chg>=0?'+':'')+chg+'%';
      }},
    grid: {left:'3%',right:'10%',bottom:'10%',top:'15%',containLabel:true},
    legend: {data:['份额(亿份)'],textStyle:{color:'#94a3b8',fontSize:10},top:0},
    xAxis: {type:'category',data:t.dates,axisLabel:{color:'#64748b',fontSize:9,rotate:30,interval:2},axisLine:{lineStyle:{color:'#1e293b'}}},
    yAxis: {type:'value',name:'亿份',nameTextStyle:{color:'#64748b'},axisLabel:{color:'#64748b',fontSize:9},splitLine:{lineStyle:{color:'#1e293b',type:'dashed'}}},
    series: [{
      name:'份额(亿份)', type:'line', data:shares, smooth:true,
      symbol:'circle', symbolSize:5,
      lineStyle:{color:lineColor,width:2},
      itemStyle:{color:lineColor},
      areaStyle:{color:new echarts.graphic.LinearGradient(0,0,0,1,[{offset:0,color:lineColor+'33'},{offset:1,color:lineColor+'00'}])},
      markPoint:{data:[{type:'max',name:'最高',itemStyle:{color:'#f59e0b'}},{type:'min',name:'最低',itemStyle:{color:'#94a3b8'}}]},
      markLine:{
        symbol:'none',
        label:{formatter:'区间'+(up?'+':'')+change.toFixed(2)+'亿份 ('+(up?'+':'')+changePct+'%)',color:'#e2e8f0',fontSize:10,position:'end'},
        lineStyle:{color:lineColor,type:'dashed',width:1},
        data:[{yAxis:last}]
      }
    }]
  });
  return c;
}

// ETF详情弹窗（30日K线）
function openETFDetail(code) {
  var etf = (D.etf_data||[]).filter(function(e){return e.code===code;})[0];
  if (!etf) return;
  var prefix = code.startsWith('5') || code.startsWith('6') ? 'sh' + code : 'sz' + code;
  // 异步拉K线
  fetch('https://web.ifzq.gtimg.cn/appstock/app/fqkline/get?param='+prefix+',day,,,30,qfq')
    .then(function(r){return r.json();})
    .then(function(json) {
      var node = json.data[prefix] || {};
      var days = node.qfqday || node.day || [];
      var html = '<div class="modal-header"><h3>'+etf.name+' ('+etf.code+') <span style="font-size:12px;color:var(--text-muted)">'+etf.index+'</span></h3><button class="modal-close" onclick="closeModal()">✕</button></div>';
      html += '<div class="modal-grid">';
      html += modalItem('现价', etf.price.toFixed(3));
      html += modalItem('今日涨跌', (etf.change_pct>0?'+':'')+etf.change_pct.toFixed(2)+'%', etf.change_pct>0?'#ef4444':(etf.change_pct<0?'#22c55e':''));
      html += modalItem('份额', etf.shares_yi.toFixed(2)+'亿份');
      html += modalItem('规模', etf.total_value_yi.toFixed(0)+'亿元');
      html += modalItem('今日成交', (etf.amount_wan/10000).toFixed(1)+'亿元');
      html += modalItem('换手率', (etf.turnover_pct||0).toFixed(2)+'%');
      html += modalItem('52周高', (etf.high_52w||0).toFixed(3));
      html += modalItem('52周低', (etf.low_52w||0).toFixed(3));
      html += modalItem('国家队角色', etf.note);
      html += '</div>';
      if (days.length > 2) {
        html += '<div class="modal-section"><h4>近30日走势</h4><div id="etf-modal-kline" style="width:100%;height:180px"></div></div>';
      }
      document.getElementById('modal-content').innerHTML = html;
      document.getElementById('detail-modal').classList.add('show');
      if (days.length > 2) {
        setTimeout(function() {
          var kc = echarts.init(document.getElementById('etf-modal-kline'));
          kc.setOption({
            tooltip:{trigger:'axis',backgroundColor:'rgba(22,27,37,0.95)',borderColor:'#1e293b',textStyle:{color:'#e2e8f0',fontSize:11}},
            grid:{left:'5%',right:'3%',bottom:'10%',top:'5%',containLabel:true},
            xAxis:{type:'category',data:days.map(function(d){return d[0].slice(5);}),axisLabel:{color:'#64748b',fontSize:8,interval:4}},
            yAxis:{scale:true,axisLabel:{color:'#64748b',fontSize:9},splitLine:{lineStyle:{color:'#1e293b',type:'dashed'}}},
            series:[{type:'candlestick',data:days.map(function(d){return [d[1],d[2],d[3],d[4]];}),
              itemStyle:{color:'#ef4444',color0:'#22c55e',borderColor:'#ef4444',borderColor0:'#22c55e'}}]
          });
          setTimeout(function(){ kc.resize(); }, 100);
        }, 100);
      }
    })
    .catch(function() {
      alert('K线数据获取失败，请检查网络');
    });
}

// COMPARE PAGE - 多股票对比
// ============================================================
var compareSelected = [];
function renderCompare() {
  var stocks = D.stock_summary;
  var html = '<div class="chart-card-full" style="margin-bottom:12px">';
  html += '<h3>🆚 持仓对比<span style="font-size:11px;color:var(--text-muted);font-weight:400;margin-left:8px;">最多选择4只股票并排对比</span></h3>';
  html += '<div style="display:flex;flex-wrap:wrap;gap:6px;margin:8px 0">';
  stocks.slice(0,30).forEach(function(s) {
    var active = compareSelected.indexOf(s.code) >= 0;
    var color = active ? 'var(--accent)' : 'var(--bg-secondary)';
    var text = active ? '#fff' : 'var(--text2)';
    html += '<span onclick="toggleCompare(\''+s.code+'\')" style="padding:4px 10px;border-radius:4px;font-size:11px;cursor:pointer;background:'+color+';color:'+text+';border:1px solid var(--border)">'+
      s.name+(active?' ✓':'')+'</span>';
  });
  html += '</div>';
  html += '</div>';

  // 对比卡片
  if (compareSelected.length === 0) {
    html += '<div class="chart-card-full" style="text-align:center;padding:60px;color:var(--text-muted)">点击上方股票标签开始对比</div>';
  } else {
    var selected = stocks.filter(function(s){return compareSelected.indexOf(s.code)>=0;});
    html += '<div class="chart-card-full">';
    // 用 table-layout:fixed + 明确宽度，确保列对齐
    html += '<table class="data-table" style="table-layout:fixed;width:100%"><colgroup><col style="width:90px">';
    selected.forEach(function() { html += '<col style="width:auto">'; });
    html += '</colgroup><thead><tr>';
    html += '<th style="text-align:left;background:var(--bg-hover);position:sticky;left:0;z-index:2;border-right:2px solid var(--border)">指标</th>';
    selected.forEach(function(s) { html += '<th style="color:var(--cyan);background:var(--bg-hover);text-align:center;border-right:1px solid rgba(30,41,59,0.5)">'+s.name+'</th>'; });
    html += '</tr></thead><tbody>';

    var rows = [
      ['现价', function(s){return s.price.toFixed(2);}],
      ['涨跌幅%', function(s){return (s.change_pct>0?'+':'')+s.change_pct.toFixed(2)+'%';}],
      ['PE(TTM)', function(s){return s.pe_ttm>0?s.pe_ttm.toFixed(1):'-';}],
      ['PB', function(s){return s.pb>0?s.pb.toFixed(2):'-';}],
      ['总市值(亿)', function(s){return s.mcap_yi.toFixed(0);}],
      ['持仓市值(亿)', function(s){return s.total_holding_value.toFixed(1);}],
      ['52周位置', function(s){return (s.week_52_position||0).toFixed(0)+'%';}],
      ['量比', function(s){return (s.volume_ratio||0).toFixed(2);}],
      ['换手率%', function(s){return (s.turnover_pct||0).toFixed(2);}],
      ['振幅%', function(s){return (s.amplitude||0).toFixed(2);}],
      ['风格', function(s){var st=getStyleTag(s.pe_ttm);return st.label||'-';}],
      ['行业', function(s){return s.industry;}],
      ['持仓团队数', function(s){return s.holders.length;}]
    ];

    rows.forEach(function(row) {
      html += '<tr>';
      html += '<td style="text-align:left;background:var(--bg-secondary);font-weight:600;position:sticky;left:0;border-right:2px solid var(--border)">'+row[0]+'</td>';
      selected.forEach(function(s) {
        var val = row[1](s);
        var cls = '';
        if (row[0] === '涨跌幅%') cls = s.change_pct > 0 ? 'positive' : (s.change_pct < 0 ? 'negative' : '');
        if (row[0] === '52周位置') {
          var p = s.week_52_position||0;
          if (p > 80) cls = 'positive';
          else if (p < 20) cls = 'negative';
        }
        var colorStyle = cls ? 'color:var(--'+(cls==='positive'?'red':'green')+')' : '';
        html += '<td style="text-align:center;font-weight:500;border-right:1px solid rgba(30,41,59,0.3);'+colorStyle+'">'+val+'</td>';
      });
      html += '</tr>';
    });
    html += '</tbody></table></div>';
  }
  document.getElementById('page-compare').innerHTML = html;
}

function toggleCompare(code) {
  var idx = compareSelected.indexOf(code);
  if (idx >= 0) compareSelected.splice(idx, 1);
  else {
    if (compareSelected.length >= 4) {
      alert('最多对比4只');
      return;
    }
    compareSelected.push(code);
  }
  renderCompare();
}

  html += '<div class="chart-row">';
  html += '<div class="chart-card"><h3>🥧 团队持仓占比</h3><div class="chart-box" id="ent_pie"></div></div>';
  html += '<div class="chart-card"><h3>📊 团队持仓明细</h3><div class="chart-box" id="ent_detail"></div></div>';
  html += '</div>';

  document.getElementById('page-entities').innerHTML = html;

  setTimeout(function() {
    charts.ent_pie = renderTeamPie('ent_pie');
    charts.ent_detail = renderTeamComparison('ent_detail');
  }, 50);
}

// ============================================================
// COMMON CHART FUNCTIONS
// ============================================================
function renderTeamPie(id) {
  var c = echarts.init(document.getElementById(id));
  var data = D.team_summary;
  var teamColors = {'中央汇金':'#ef4444','证金公司':'#00d4ff','社保基金':'#22c55e','养老金':'#f59e0b','国家大基金':'#14b8a6'};
  c.setOption({
    tooltip: {trigger:'item',formatter:function(p){return p.name+'<br/>'+p.value.toFixed(1)+'亿 ('+p.percent+'%)';}},
    legend: {bottom:0,textStyle:{color:'#94a3b8',fontSize:11}},
    series: [{type:'pie',radius:['45%','75%'],center:['50%','48%'],itemStyle:{borderRadius:6,borderColor:'#0a0e17',borderWidth:2},
      label:{color:'#94a3b8',fontSize:11},data:data.map(function(d){return{name:d.team,value:d.total_holding_value,itemStyle:{color:teamColors[d.team]||'#94a3b8'}};})}]});
  return c;
}

function renderSectorBar(id) {

      label:{show:true,position:'right',fontSize:10,color:'#94a3b8',formatter:function(p){var v=p.value;return v>10000?(v/10000).toFixed(1)+'万亿':v.toFixed(0)+'亿';}}}]});

}

function renderTeamComparison(id) {
  var c = echarts.init(document.getElementById(id));
  var data = D.team_summary;
  var teamColors = {'中央汇金':'#ef4444','证金公司':'#00d4ff','社保基金':'#22c55e','养老金':'#f59e0b','国家大基金':'#14b8a6'};

function renderTreemap(id) {
  var c = echarts.init(document.getElementById(id));
  var treeData = [];
  var sectors = {};
  D.stock_summary.forEach(function(s) {
    var sec = s.sector;
    if (!sectors[sec]) sectors[sec] = [];
    sectors[sec].push(s);
  });
  Object.keys(sectors).forEach(function(sec) {
    treeData.push({name:sec,children:sectors[sec].map(function(s){return{name:s.name,value:s.total_holding_value};})});
  });
  c.setOption({
    tooltip: {formatter:function(p){return p.name+'<br/>持仓市值: '+p.value.toFixed(1)+'亿';}},
    series: [{type:'treemap',data:treeData,width:'100%',height:'100%',roam:false,
      label:{show:true,formatter:function(p){return p.name+'\n'+p.value.toFixed(0)+'亿';},fontSize:10,color:'#e2e8f0'},
      upperLabel:{show:true,height:30,fontSize:13,color:'#e2e8f0'},
      itemStyle:{borderColor:'#0a0e17',borderWidth:2},
      levels:[{itemStyle:{borderColor:'#0a0e17',borderWidth:3,gapWidth:2},
        upperLabel:{show:true,fontSize:13,fontWeight:'bold'}},
        {colorSaturation:[0.3,0.6],itemStyle:{borderColorSaturation:0.7,gapWidth:1,borderWidth:1}}]}]});
  return c;
}

function renderHeatmap(id) {
  var c = echarts.init(document.getElementById(id));
  var matrix = D.industry_team_matrix || {};
  var teams = D.team_summary.map(function(t){return t.team;});
  var industries = [];
  var industrySet = {};
  D.holdings_detail.forEach(function(d){ if(!industrySet[d.industry]){industrySet[d.industry]=1;industries.push(d.industry);} });

  var data = [];
  var maxVal = 1; // 避免0
  Object.keys(matrix).forEach(function(k) {
    var v = matrix[k];
    if (v > maxVal) maxVal = v;
  });
  teams.forEach(function(t,ti) {
    industries.forEach(function(ind,ii) {
      var v = matrix[ind+'|'+t] || 0;
      data.push([ii, ti, v]);
    });
  });

  c.setOption({
    tooltip: {
      formatter: function(p) {
        var v = p.value[2];
        if (!v) return industries[p.value[0]]+' × '+teams[p.value[1]]+'<br/>无持仓';
        return industries[p.value[0]]+' × '+teams[p.value[1]]+'<br/>持仓市值: '+(v>10000?(v/10000).toFixed(2)+'万亿':v.toFixed(1)+'亿');
      }
    },
    grid: { left: '12%', right: '8%', bottom: '20%', top: '3%', containLabel: true },
    xAxis: {
      type: 'category', data: industries,
      axisLabel: { color: '#94a3b8', fontSize: 10, rotate: 25, interval: 0 },
      splitArea: { show: true, areaStyle: { color: ['rgba(0,0,0,0)', 'rgba(255,255,255,0.02)'] } },
      axisLine: { lineStyle: { color: '#1e293b' } },
      axisTick: { show: false }
    },
    yAxis: {
      type: 'category', data: teams,
      axisLabel: { color: '#94a3b8', fontSize: 10 },
      splitArea: { show: true, areaStyle: { color: ['rgba(0,0,0,0)', 'rgba(255,255,255,0.02)'] } },
      axisLine: { lineStyle: { color: '#1e293b' } },
      axisTick: { show: false }
    },
    visualMap: {
      min: 0, max: maxVal,
      calculable: false,
      orient: 'horizontal',
      left: 'center', bottom: 0,
      itemWidth: 12, itemHeight: 100,
      inRange: { color: ['#fef9c3', '#fde68a', '#fcd34d', '#f59e0b', '#d97706'] },
      textStyle: { color: '#94a3b8', fontSize: 9 },
      formatter: function(v) { return v>10000?(v/10000).toFixed(1)+'万亿':v.toFixed(0)+'亿'; },
      text: ['高','低']
    },
    series: [{
      type: 'heatmap', data: data,
      label: { show: true, fontSize: 8, color: '#78350f', fontWeight: 600, formatter: function(p) {
        var v = p.value[2];
        if (v === 0) return '·';
        if (v > 10000) return (v/10000).toFixed(2)+'w';
        if (v > 100) return v.toFixed(0)+'亿';
        if (v > 1) return v.toFixed(1)+'亿';
        return '<1亿';
      }},
      itemStyle: {
        borderColor: '#0a0e17',
        borderWidth: 1,
        emptyColor: 'transparent'  // 空白格完全透明，看到背景
      },
      emphasis: { itemStyle: { shadowBlur: 10, shadowColor: 'rgba(0,212,255,0.5)' } }
    }]
  });
  return c;
}

// ============================================================
// SEARCH
// ============================================================
function onSearch(query) {
  if (!query || query.trim().length < 1) {
    filteredData = null;
    if (activePage === 'holdings') renderHoldings();
    return;
  }
  var q = query.toLowerCase();
  filteredData = D.holdings_detail.filter(function(d) {
    return d.name.toLowerCase().includes(q) ||
           d.code.includes(q) ||
           d.industry.includes(query) ||
           d.team.includes(query) ||
           d.entity.includes(query) ||
           d.sector.includes(query);
  });
  if (activePage === 'holdings') {
    document.getElementById('page-holdings').innerHTML = '<div class="chart-card-full">'+
      '<h3>📋 搜索结果: '+filteredData.length+' 条匹配</h3>'+
      buildHoldingsTable(filteredData)+'</div>';
  }
}

// ============================================================
// STOCK DETAIL MODAL
// ============================================================
function openStockDetail(code) {
  var details = D.holdings_detail.filter(function(d){return d.code===code});
  var summary = D.stock_summary.filter(function(s){return s.code===code})[0];
  if (!summary || details.length===0) return;

  var d = details[0]; // use first entry for common fields
  var html = '<div class="modal-header">'+
    '<h3>'+d.name+' ('+d.code+') <span style="font-size:12px;color:var(--text-muted)">'+d.industry+'</span></h3>'+
    '<button class="modal-close" onclick="closeModal()">✕</button></div>';

  // Market data
  html += '<div class="modal-grid">';
  html += modalItem('现价', d.price.toFixed(2));
  html += modalItem('涨跌幅', (d.change_pct>0?'+':'')+d.change_pct.toFixed(2)+'%', d.change_pct>0?'#ef4444':(d.change_pct<0?'#22c55e':''));
  html += modalItem('今开', (d.open||0).toFixed(2));
  html += modalItem('最高', (d.high||0).toFixed(2));
  html += modalItem('最低', (d.low||0).toFixed(2));
  html += modalItem('昨收', (d.price-d.change_amount||0).toFixed(2));
  html += modalItem('成交额', ((d.amount_wan||0)/10000).toFixed(2)+'亿');
  html += modalItem('换手率', (d.turnover_pct||0).toFixed(2)+'%');
  html += modalItem('量比', (d.volume_ratio||0).toFixed(2));
  html += modalItem('振幅', (d.amplitude||0).toFixed(2)+'%');
  html += modalItem('52周高', (d.high_52w||0).toFixed(2));
  html += modalItem('52周低', (d.low_52w||0).toFixed(2));
  html += '</div>';

  // Valuation
  html += '<div class="modal-section"><h4>估值指标 <span style="font-size:10px;color:var(--text-muted)">来源:腾讯实时</span></h4><div class="modal-grid">';
  html += modalItem('PE(TTM)', (d.pe_ttm>0?d.pe_ttm.toFixed(1):'-'));
  html += modalItem('PB', (d.pb>0?d.pb.toFixed(2):'-'));
  html += modalItem('总市值', (d.mcap_yi||0).toFixed(0)+'亿');
  html += modalItem('流通市值', (d.float_mcap_yi||0).toFixed(0)+'亿');
  html += modalItem('52周高', (d.high_52w||0).toFixed(2));
  html += modalItem('52周低', (d.low_52w||0).toFixed(2));
  html += modalItem('52周位置', (d.week_52_position||0).toFixed(0)+'%', (d.week_52_position||0)>80?'#ef4444':((d.week_52_position||0)<20?'#22c55e':''));
  html += modalItem('量比', (d.volume_ratio||0).toFixed(2));
  html += modalItem('涨停价', (d.limit_up||0).toFixed(2));
  html += modalItem('跌停价', (d.limit_down||0).toFixed(2));
  html += '</div></div>';

  // Holdings detail
  html += '<div class="modal-section"><h4>国家队持仓明细</h4>';
  html += '<table class="data-table"><thead><tr><th>实体</th><th>团队</th><th>持股数(万股)</th><th>占比</th><th>变动</th><th>市值(亿)</th></tr></thead><tbody>';
  details.forEach(function(h) {
    var sharesStr = h.shares > 1e9 ? (h.shares/1e8).toFixed(1)+'亿' : (h.shares/10000).toFixed(0)+'万';
    html += '<tr><td>'+h.entity+'</td><td><span class="tag tag-'+getTeamTagClass(h.team_type)+'">'+h.team+'</span></td>'+
      '<td style="text-align:right">'+sharesStr+'</td><td style="text-align:right">'+h.ratio.toFixed(2)+'%</td>'+
      '<td>'+(h.change_qoq===0?'不变':(h.change_qoq>0?'<span class=positive>+'+(h.change_qoq/10000).toFixed(0)+'万股</span>':'<span class=negative>'+(h.change_qoq/10000).toFixed(0)+'万股</span>'))+'</td>'+
      '<td style="text-align:right;font-weight:600;color:var(--accent)">'+h.holding_value_yi.toFixed(1)+'</td></tr>';
  });
  html += '</tbody></table></div>';

  // 动量指标 + K线图
  html += '<div class="modal-section"><h4>每日动量 <span style="font-size:10px;color:var(--text-muted)">来源:腾讯K线(每日更新)</span></h4><div class="modal-grid">';
  html += modalItem('近5日涨跌', (d.chg_5d!=null?(d.chg_5d>0?'+':'')+d.chg_5d.toFixed(2)+'%':'-'), d.chg_5d>0?'#ef4444':(d.chg_5d<0?'#22c55e':''));
  html += modalItem('近20日涨跌', (d.chg_20d!=null?(d.chg_20d>0?'+':'')+d.chg_20d.toFixed(2)+'%':'-'), d.chg_20d>0?'#ef4444':(d.chg_20d<0?'#22c55e':''));
  html += modalItem('近20日回撤', (d.max_drawdown_20d!=null?d.max_drawdown_20d.toFixed(2)+'%':'-'), d.max_drawdown_20d<0?'#22c55e':'');
  html += modalItem('近20日高点', (d.high_20d||0).toFixed(2));
  html += modalItem('近20日低点', (d.low_20d||0).toFixed(2));
  html += modalItem('K线数据', (summary.kline&&summary.kline.length>0?summary.kline.length+'个交易日':'无'));
  html += '</div>';
  if (summary.kline && summary.kline.length > 2) {
    html += '<div id="modal-kline" style="width:100%;height:160px;margin-top:10px"></div>';
  }
  html += '</div>';

  document.getElementById('modal-content').innerHTML = html;
  document.getElementById('detail-modal').classList.add('show');

  // 渲染K线图
  if (summary.kline && summary.kline.length > 2) {
    setTimeout(function() {
      var kc = echarts.init(document.getElementById('modal-kline'));
      var dates = summary.kline.map(function(k){return k[0].slice(5);});
      var kData = summary.kline.map(function(k){return [k[1],k[2],k[3],k[4]];});
      kc.setOption({
        tooltip: {trigger:'axis',backgroundColor:'rgba(22,27,37,0.95)',borderColor:'#1e293b',textStyle:{color:'#e2e8f0',fontSize:11}},
        grid: {left:'5%',right:'3%',bottom:'10%',top:'5%',containLabel:true},
        xAxis: {type:'category',data:dates,axisLabel:{color:'#64748b',fontSize:8,interval:4}},
        yAxis: {scale:true,axisLabel:{color:'#64748b',fontSize:9},splitLine:{lineStyle:{color:'#1e293b',type:'dashed'}}},
        dataZoom: [{type:'inside',start:0,end:100}],
        series: [{type:'candlestick',data:kData,
          itemStyle:{color:'#ef4444',color0:'#22c55e',borderColor:'#ef4444',borderColor0:'#22c55e'}}]
      });
      setTimeout(function(){ kc.resize(); }, 100);
    }, 100);
  }
}

function modalItem(label, value, color) {
  return '<div class="modal-item"><div class="label">'+label+'</div><div class="value" style="'+(color?'color:'+color:'')+'">'+value+'</div></div>';
}

function closeModal() {
  document.getElementById('detail-modal').classList.remove('show');
}

// ============================================================
// INIT
// ============================================================
function init() {
  if (!loadData()) {
    document.getElementById('page-overview').innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted);">数据加载失败</div>';
    return;
  }
  initNav();
  renderPage('overview');

  // Keyboard navigation
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') closeModal();
  });

  // Window resize
  window.addEventListener('resize', function() {
    Object.values(charts).forEach(function(c) { try { c.resize(); } catch(e){} });
  });
}

document.addEventListener('DOMContentLoaded', init);
</script>
